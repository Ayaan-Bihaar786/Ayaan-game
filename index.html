<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>3D Open World Battle</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:10;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

#healthBox{
  width:220px;
  height:20px;
  border:2px solid white;
  background:#333;
  margin-top:5px;
}

#health{
  height:100%;
  width:100%;
  background:#20d64b;
}

#message{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:20px;
  font-weight:bold;
  text-shadow:2px 2px 5px #000;
  z-index:20;
}

#buttons{
  position:fixed;
  right:18px;
  bottom:20px;
  width:190px;
  height:190px;
  z-index:30;
}

.btn{
  position:absolute;
  width:68px;
  height:68px;
  border-radius:20px;
  border:3px solid white;
  background:rgba(20,20,20,.70);
  color:white;
  font-size:30px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

.btn:active{
  background:rgba(0,180,255,.8);
  transform:scale(.94);
}

#up{left:61px;top:0}
#down{left:61px;bottom:0}
#left{left:0;top:61px}
#right{right:0;top:61px}

#shoot{
  position:fixed;
  right:25px;
  bottom:225px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:rgba(210,30,30,.85);
  border:4px solid white;
  color:white;
  font-size:22px;
  font-weight:bold;
  z-index:30;
}

#shoot:active{
  transform:scale(.9);
  background:red;
}

#start{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:100;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  text-align:center;
}

#start h1{
  font-size:30px;
}

#start button{
  padding:16px 35px;
  font-size:20px;
  border:0;
  border-radius:12px;
  background:#168cff;
  color:white;
  font-weight:bold;
}

#photo{
  max-width:280px;
}

#gameOver{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  color:white;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
}

#gameOver button{
  padding:15px 30px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="start">
  <h1>🎮 3D OPEN WORLD BATTLE</h1>
  <p>अपनी फोटो लगाएँ और गेम शुरू करें</p>
  <input id="photo" type="file" accept="image/*">
  <button onclick="startGame()">GAME START</button>
  <p>मोबाइल में बड़े बटन से चलाएँ और FIRE से गोली चलाएँ</p>
</div>

<div id="hud">
  ❤️ Health: <span id="hpText">100</span>
  &nbsp;&nbsp; 🎯 Kills: <span id="kills">0</span>
  <div id="healthBox">
    <div id="health"></div>
  </div>
</div>

<div id="message"></div>

<div id="buttons">
  <div class="btn" id="up">▲</div>
  <div class="btn" id="down">▼</div>
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
</div>

<button id="shoot">🔥 FIRE</button>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <h2>आपके Kills: <span id="finalKills">0</span></h2>
  <button onclick="location.reload()">RESTART</button>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
   GAME VARIABLES
========================= */

let scene, camera, renderer;
let player;
let enemies=[];
let bullets=[];
let enemyBullets=[];
let cars=[];
let buildings=[];
let trees=[];

let running=false;
let hp=100;
let kills=0;

let keys={
  up:false,
  down:false,
  left:false,
  right:false,
  shoot:false
};

let clock=new THREE.Clock();

const WORLD=1000;


/* =========================
   START GAME
========================= */

function startGame(){

  document.getElementById("start").style.display="none";

  createScene();
  createWorld();
  createPlayer();

  for(let i=0;i<12;i++){
    createEnemy();
  }

  running=true;

  say("गेम शुरू हो गया है। दुश्मनों से सावधान!");

  animate();
}


/* =========================
   SCENE
========================= */

function createScene(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x87ceeb);

  scene.fog=new THREE.Fog(0x87ceeb,400,1100);


  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    2000
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;

  document.body.appendChild(renderer.domElement);


  /* LIGHT */

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  sun.position.set(300,500,200);
  sun.castShadow=true;

  scene.add(sun);


  const ambient=new THREE.AmbientLight(
    0xffffff,
    .6
  );

  scene.add(ambient);


  /* GROUND */

  const groundGeo=new THREE.PlaneGeometry(
    WORLD,
    WORLD
  );

  const groundMat=new THREE.MeshStandardMaterial({
    color:0x4f8b3a
  });

  const ground=new THREE.Mesh(
    groundGeo,
    groundMat
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);
}


/* =========================
   ROAD
========================= */

function createRoad(x,z,w,d){

  const geo=new THREE.BoxGeometry(
    w,
    .08,
    d
  );

  const mat=new THREE.MeshStandardMaterial({
    color:0x303030
  });

  const road=new THREE.Mesh(geo,mat);

  road.position.set(x,.04,z);

  scene.add(road);


  /* ROAD LINES */

  for(let i=-w/2;i<w/2;i+=30){

    const lineGeo=new THREE.BoxGeometry(
      12,
      .1,
      1
    );

    const lineMat=new THREE.MeshBasicMaterial({
      color:0xffffff
    });

    const line=new THREE.Mesh(
      lineGeo,
      lineMat
    );

    line.position.set(
      x+i,
      .1,
      z
    );

    scene.add(line);
  }
}


/* =========================
   BUILDINGS
========================= */

function createBuilding(x,z){

  const h=25+Math.random()*25;
  const w=30+Math.random()*30;
  const d=30+Math.random()*30;

  const geo=new THREE.BoxGeometry(
    w,h,d
  );

  const mat=new THREE.MeshStandardMaterial({
    color:
      new THREE.Color(
        0.35+Math.random()*.3,
        0.25+Math.random()*.3,
        0.18+Math.random()*.3
      )
  });

  const building=new THREE.Mesh(
    geo,
    mat
  );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  buildings.push(building);


  /* ROOF */

  const roofGeo=new THREE.ConeGeometry(
    Math.max(w,d)*.7,
    12,
    4
  );

  const roofMat=new THREE.MeshStandardMaterial({
    color:0x8b2e22
  });

  const roof=new THREE.Mesh(
    roofGeo,
    roofMat
  );

  roof.position.set(
    x,
    h+6,
    z
  );

  roof.rotation.y=Math.PI/4;

  scene.add(roof);
}


/* =========================
   TREES
========================= */

function createTree(x,z){

  const trunkGeo=new THREE.CylinderGeometry(
    2,
    3,
    12,
    8
  );

  const trunkMat=new THREE.MeshStandardMaterial({
    color:0x704214
  });

  const trunk=new THREE.Mesh(
    trunkGeo,
    trunkMat
  );

  trunk.position.set(x,6,z);

  scene.add(trunk);


  const leafGeo=new THREE.SphereGeometry(
    10,
    12,
    12
  );

  const leafMat=new THREE.MeshStandardMaterial({
    color:0x146b28
  });

  const leaves=new THREE.Mesh(
    leafGeo,
    leafMat
  );

  leaves.position.set(x,18,z);

  scene.add(leaves);

  trees.push(trunk,leaves);
}


/* =========================
   CAR
========================= */

function createCar(x,z){

  const group=new THREE.Group();


  const bodyGeo=new THREE.BoxGeometry(
    18,
    6,
    10
  );

  const bodyMat=new THREE.MeshStandardMaterial({
    color:
      Math.random()>.5
      ?0x1464ff
      :0xd62828
  });

  const body=new THREE.Mesh(
    bodyGeo,
    bodyMat
  );

  body.position.y=5;

  group.add(body);


  const topGeo=new THREE.BoxGeometry(
    9,
    5,
    8
  );

  const topMat=new THREE.MeshStandardMaterial({
    color:0x222222
  });

  const top=new THREE.Mesh(
    topGeo,
    topMat
  );

  top.position.set(0,10,0);

  group.add(top);


  for(let i of [-6,6]){

    for(let j of [-5,5]){

      const wheelGeo=
        new THREE.CylinderGeometry(
          2.5,
          2.5,
          2,
          16
        );

      const wheelMat=
        new THREE.MeshStandardMaterial({
          color:0x111111
        });

      const wheel=
        new THREE.Mesh(
          wheelGeo,
          wheelMat
        );

      wheel.rotation.z=Math.PI/2;

      wheel.position.set(
        i,
        2.5,
        j
      );

      group.add(wheel);
    }
  }


  group.position.set(x,0,z);

  scene.add(group);

  cars.push(group);
}


/* =========================
   WORLD
========================= */

function createWorld(){

  createRoad(0,0,900,45);
  createRoad(0,0,45,900);


  for(let i=0;i<35;i++){

    let x=(Math.random()-.5)*850;
    let z=(Math.random()-.5)*850;

    if(Math.abs(x)<80 || Math.abs(z)<80)
      continue;

    createBuilding(x,z);
  }


  for(let i=0;i<45;i++){

    let x=(Math.random()-.5)*900;
    let z=(Math.random()-.5)*900;

    if(Math.abs(x)<60 || Math.abs(z)<60)
      continue;

    createTree(x,z);
  }


  for(let i=0;i<20;i++){

    let x=(Math.random()-.5)*800;
    let z=(Math.random()-.5)*800;

    createCar(x,z);
  }
}


/* =========================
   CHARACTER
========================= */

function makeCharacter(color){

  const g=new THREE.Group();


  /* BODY */

  const bodyGeo=new THREE.BoxGeometry(
    8,
    13,
    5
  );

  const bodyMat=
    new THREE.MeshStandardMaterial({
      color:color
    });

  const body=new THREE.Mesh(
    bodyGeo,
    bodyMat
  );

  body.position.y=15;

  body.castShadow=true;

  g.add(body);


  /* HEAD */

  const headGeo=
    new THREE.SphereGeometry(
      5,
      24,
      24
    );

  const headMat=
    new THREE.MeshStandardMaterial({
      color:0xffc79c
    });

  const head=new THREE.Mesh(
    headGeo,
    headMat
  );

  head.position.y=27;

  head.castShadow=true;

  g.add(head);


  /* LEGS */

  for(let x of [-2.3,2.3]){

    const legGeo=
      new THREE.BoxGeometry(
        3,
        12,
        3
      );

    const legMat=
      new THREE.MeshStandardMaterial({
        color:0x202020
      });

    const leg=new THREE.Mesh(
      legGeo,
      legMat
    );

    leg.position.set(
      x,
      5,
      0
    );

    g.add(leg);
  }


  /* ARMS */

  for(let x of [-6,6]){

    const armGeo=
      new THREE.BoxGeometry(
        3,
        12,
        3
      );

    const armMat=
      new THREE.MeshStandardMaterial({
        color:color
      });

    const arm=new THREE.Mesh(
      armGeo,
      armMat
    );

    arm.position.set(
      x,
      16,
      0
    );

    arm.rotation.z=
      x>0 ? -.35 : .35;

    g.add(arm);
  }


  /* GUN */

  const gunGeo=
    new THREE.BoxGeometry(
      12,
      2,
      2
    );

  const gunMat=
    new THREE.MeshStandardMaterial({
      color:0x111111
    });

  const gun=new THREE.Mesh(
    gunGeo,
    gunMat
  );

  gun.position.set(
    7,
    17,
    -3
  );

  g.add(gun);

  return g;
}


/* =========================
   PLAYER
========================= */

function createPlayer(){

  player=makeCharacter(0x1769ff);

  player.position.set(
    0,
    0,
    100
  );

  scene.add(player);

  camera.position.set(
    0,
    55,
    80
  );

  camera.lookAt(player.position);
}


/* =========================
   ENEMY
========================= */

function createEnemy(){

  const e=makeCharacter(0xc51d28);

  e.position.set(
    (Math.random()-.5)*700,
    0,
    (Math.random()-.5)*700
  );

  scene.add(e);

  enemies.push({
    mesh:e,
    hp:3,
    cooldown:Math.random()*2
  });
}


/* =========================
   PLAYER SHOOT
========================= */

function shoot(){

  if(!running)return;

  const geo=
    new THREE.SphereGeometry(
      1.5,
      8,
      8
    );

  const mat=
    new THREE.MeshBasicMaterial({
      color:0xffff00
    });

  const b=new THREE.Mesh(
    geo,
    mat
  );

  b.position.copy(player.position);

  b.position.y+=17;

  /* Shoot toward camera/player direction */

  const direction=
    new THREE.Vector3(
      0,
      0,
      -1
    );

  direction.applyQuaternion(
    player.quaternion
  );

  bullets.push({
    mesh:b,
    velocity:direction.multiplyScalar(70),
    life:3
  });

  scene.add(b);
}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(e){

  const bGeo=
    new THREE.SphereGeometry(
      1.4,
      8,
      8
    );

  const bMat=
    new THREE.MeshBasicMaterial({
      color:0xff3300
    });

  const b=new THREE.Mesh(
    bGeo,
    bMat
  );

  b.position.copy(e.mesh.position);
  b.position.y+=17;

  const direction=
    player.position.clone()
      .sub(b.position)
      .normalize();

  enemyBullets.push({
    mesh:b,
    velocity:direction.multiplyScalar(35),
    life:5
  });

  scene.add(b);
}


/* =========================
   UPDATE
========================= */

function update(dt){

  if(!player)return;


  /* PLAYER MOVEMENT */

  let speed=35*dt;

  if(keys.up){
    player.translateZ(-speed);
  }

  if(keys.down){
    player.translateZ(speed);
  }

  if(keys.left){
    player.rotation.y+=2.5*dt;
  }

  if(keys.right){
    player.rotation.y-=2.5*dt;
  }


  /* LIMIT WORLD */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -480,
      480
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -480,
      480
    );


  /* SHOOT */

  if(keys.shoot){
    if(!shootTimer){
      shoot();
      shootTimer=.22;
    }
  }

  if(shootTimer){
    shootTimer-=dt;

    if(shootTimer<0)
      shootTimer=0;
  }


  /* BULLETS */

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.mesh.position.addScaledVector(
      b.velocity,
      dt
    );

    b.life-=dt;

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){

      const e=enemies[j];

      if(
        b.mesh.position.distanceTo(
          e.mesh.position
        )<10
      ){

        e.hp--;

        scene.remove(b.mesh);

        bullets.splice(i,1);

        hit=true;

        if(e.hp<=0){

          scene.remove(e.mesh);

          enemies.splice(j,1);

          kills++;

          document.getElementById(
            "kills"
          ).textContent=kills;

          say("एक दुश्मन खत्म!");
        }

        break;
      }
    }

    if(!hit && b.life<=0){

      scene.remove(b.mesh);

      bullets.splice(i,1);
    }
  }


  /* ENEMIES */

  enemies.forEach(e=>{

    const dist=
      e.mesh.position.distanceTo(
        player.position
      );

    /* Move toward player */

    if(dist>35){

      const dir=
        player.position.clone()
          .sub(e.mesh.position)
          .normalize();

      e.mesh.position.addScaledVector(
        dir,
        12*dt
      );

      e.mesh.lookAt(
        player.position.x,
        e.mesh.position.y,
        player.position.z
      );
    }


    e.cooldown-=dt;

    if(
      dist<250 &&
      e.cooldown<=0
    ){

      enemyShoot(e);

      e.cooldown=
        1.2+Math.random()*1.5;
    }


    if(dist<25){

      hp-=8*dt;

      updateHealth();
    }
  });


  /* ENEMY BULLETS */

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=enemyBullets[i];

    b.mesh.position.addScaledVector(
      b.velocity,
      dt
    );

    b.life-=dt;


    if(
      b.mesh.position.distanceTo(
        player.position
      )<10
    ){

      hp-=15;

      updateHealth();

      scene.remove(b.mesh);

      enemyBullets.splice(i,1);

      continue;
    }


    if(b.life<=0){

      scene.remove(b.mesh);

      enemyBullets.splice(i,1);
    }
  }


  /* CAMERA FOLLOW */

  const camTarget=
    player.position.clone();

  const offset=
    new THREE.Vector3(
      0,
      55,
      75
    );

  offset.applyQuaternion(
    player.quaternion
  );

  camera.position.lerp(
    camTarget.clone().add(offset),
    .12
  );

  camera.lookAt(
    camTarget.x,
    camTarget.y+12,
    camTarget.z
  );
}


/* =========================
   HEALTH
========================= */

function updateHealth(){

  hp=Math.max(0,hp);

  document.getElementById(
    "hpText"
  ).textContent=Math.floor(hp);

  document.getElementById(
    "health"
  ).style.width=hp+"%";


  if(hp<=0){

    running=false;

    document.getElementById(
      "finalKills"
    ).textContent=kills;

    document.getElementById(
      "gameOver"
    ).style.display="flex";
  }
}


/* =========================
   SPEECH
========================= */

function say(text){

  if(!("speechSynthesis" in window))
    return;

  speechSynthesis.cancel();

  const u=
    new SpeechSynthesisUtterance(text);

  u.lang="hi-IN";
  u.rate=.9;
  u.pitch=1;

  speechSynthesis.speak(u);

  const msg=
    document.getElementById("message");

  msg.textContent=text;

  setTimeout(()=>{
    msg.textContent="";
  },2500);
}


/* =========================
   MOBILE BUTTONS
========================= */

function hold(id,key){

  const el=
    document.getElementById(id);

  el.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  el.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  el.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );

  el.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );

  el.addEventListener(
    "mouseleave",
    ()=>{
      keys[key]=false;
    }
  );
}


hold("up","up");
hold("down","down");
hold("left","left");
hold("right","right");
hold("shoot","shoot");


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowUp" || e.key==="w")
      keys.up=true;

    if(e.key==="ArrowDown" || e.key==="s")
      keys.down=true;

    if(e.key==="ArrowLeft" || e.key==="a")
      keys.left=true;

    if(e.key==="ArrowRight" || e.key==="d")
      keys.right=true;

    if(e.code==="Space")
      keys.shoot=true;
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowUp" || e.key==="w")
      keys.up=false;

    if(e.key==="ArrowDown" || e.key==="s")
      keys.down=false;

    if(e.key==="ArrowLeft" || e.key==="a")
      keys.left=false;

    if(e.key==="ArrowRight" || e.key==="d")
      keys.right=false;

    if(e.code==="Space")
      keys.shoot=false;
  }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================
   GAME LOOP
========================= */

let shootTimer=0;

function animate(){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(running)
    update(dt);

  renderer.render(
    scene,
    camera
  );
}

</script>
