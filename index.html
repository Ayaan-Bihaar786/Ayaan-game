<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Photo Battle Arena</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  color:white;
  text-align:center;
  background:
  radial-gradient(circle at 50% 20%,#28567a,#071018 70%);
}

#menu h1{
  font-size:34px;
  text-shadow:0 0 18px #00d9ff;
}

#menu p{
  font-size:17px;
}

#photoButton{
  background:#087cff;
  padding:15px 25px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
}

#photoInput{
  display:none;
}

#startButton{
  border:0;
  border-radius:12px;
  padding:15px 35px;
  background:#16b957;
  color:white;
  font-size:19px;
  font-weight:bold;
}

#game{
  display:none;
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.top{
  position:absolute;
  top:10px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 12px;
  z-index:20;
}

.info{
  color:white;
  background:rgba(0,0,0,.65);
  padding:8px 13px;
  border-radius:10px;
  font-size:19px;
  font-weight:bold;
}

.controls{
  position:absolute;
  left:0;
  bottom:18px;
  width:100%;
  padding:0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:30;
}

.move{
  display:flex;
  gap:10px;
}

.btn{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:28px;
}

#shoot{
  width:85px;
  height:85px;
  background:#d82121;
  font-size:30px;
}

#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:90;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  color:white;
  text-align:center;
  background:rgba(0,0,0,.86);
}

#gameOver h2{
  font-size:40px;
}

#restart{
  padding:14px 30px;
  border:0;
  border-radius:12px;
  background:#087cff;
  color:white;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

  <h1>🎮 PHOTO BATTLE</h1>

  <p>अपना फोटो लगाकर पूरा कैरेक्टर बनाएं</p>

  <label id="photoButton">
    📷 अपना फोटो चुनें
    <input id="photoInput" type="file" accept="image/*">
  </label>

  <button id="startButton">
    ▶ गेम शुरू करें
  </button>

</div>


<!-- GAME -->

<div id="game">

  <div class="top">

    <div class="info">
      ❤️ <span id="health">100</span>
    </div>

    <div class="info">
      🏆 <span id="score">0</span>
    </div>

  </div>


  <canvas id="canvas"></canvas>


  <div class="controls">

    <div class="move">

      <button class="btn" id="left">◀</button>

      <button class="btn" id="right">▶</button>

    </div>

    <button class="btn" id="shoot">
      🔫
    </button>

  </div>


  <div id="gameOver">

    <h2>💀 GAME OVER</h2>

    <p>
      आपका स्कोर:
      <b id="finalScore">0</b>
    </p>

    <button id="restart">
      🔄 फिर से खेलें
    </button>

  </div>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const game =
document.getElementById("game");

const photoInput =
document.getElementById("photoInput");

const startButton =
document.getElementById("startButton");

const healthText =
document.getElementById("health");

const scoreText =
document.getElementById("score");

const gameOver =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");


let photo=null;

let player=null;

let enemies=[];
let bullets=[];
let particles=[];

let score=0;

let running=false;

let leftPressed=false;
let rightPressed=false;

let enemyTimer;


/* =====================
   CANVAS
===================== */

function resize(){

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  if(player){

    player.y=
      canvas.height-205;

  }

}

window.addEventListener(
  "resize",
  resize
);


/* =====================
   PHOTO
===================== */

photoInput.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)return;

    const reader=
      new FileReader();

    reader.onload=function(e){

      photo=new Image();

      photo.src=e.target.result;

    };

    reader.readAsDataURL(file);

  }
);


/* =====================
   START
===================== */

startButton.onclick=function(){

  resize();

  menu.style.display="none";

  game.style.display="block";

  gameOver.style.display="none";


  player={

    x:
      canvas.width/2-35,

    y:
      canvas.height-205,

    width:70,

    height:150,

    speed:6,

    health:100

  };


  enemies=[];
  bullets=[];
  particles=[];

  score=0;

  running=true;


  clearInterval(enemyTimer);

  enemyTimer=
    setInterval(
      createEnemy,
      1000
    );


  requestAnimationFrame(loop);

};


/* =====================
   PLAYER
===================== */

function drawPlayer(){

  const x=player.x;
  const y=player.y;


  /*
    HEAD / PHOTO
  */

  if(photo && photo.complete){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x+35,
      y+30,
      29,
      0,
      Math.PI*2
    );

    ctx.clip();

    ctx.drawImage(
      photo,
      x+5,
      y,
      60,
      60
    );

    ctx.restore();

  }else{

    /* TEST HEAD */

    ctx.fillStyle="#d9a078";

    ctx.beginPath();

    ctx.arc(
      x+35,
      y+30,
      28,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
      x+35,
      y+20,
      27,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

  }


  /*
    NECK
  */

  ctx.fillStyle="#d9a078";

  ctx.fillRect(
    x+27,
    y+54,
    16,
    13
  );


  /*
    BODY / SHIRT
  */

  ctx.fillStyle="#1464a5";

  ctx.beginPath();

  ctx.roundRect(
    x+12,
    y+63,
    46,
    55,
    8
  );

  ctx.fill();


  /*
    LEFT ARM
  */

  ctx.strokeStyle="#d9a078";

  ctx.lineWidth=11;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x+15,
    y+70
  );

  ctx.lineTo(
    x-3,
    y+103
  );

  ctx.stroke();


  /*
    RIGHT ARM
  */

  ctx.beginPath();

  ctx.moveTo(
    x+55,
    y+70
  );

  ctx.lineTo(
    x+75,
    y+90
  );

  ctx.stroke();


  /*
    GUN
  */

  ctx.fillStyle="#222";

  ctx.fillRect(
    x+65,
    y+85,
    50,
    10
  );

  ctx.fillStyle="#111";

  ctx.fillRect(
    x+105,
    y+87,
    20,
    6
  );

  /* grip */

  ctx.save();

  ctx.translate(
    x+75,
    y+94
  );

  ctx.rotate(.35);

  ctx.fillRect(
    0,
    0,
    10,
    24
  );

  ctx.restore();


  /*
    PANTS
  */

  ctx.fillStyle="#202d3a";

  ctx.fillRect(
    x+15,
    y+116,
    40,
    25
  );


  /*
    LEFT LEG
  */

  ctx.strokeStyle="#202d3a";

  ctx.lineWidth=13;

  ctx.beginPath();

  ctx.moveTo(
    x+25,
    y+135
  );

  ctx.lineTo(
    x+20,
    y+166
  );

  ctx.stroke();


  /*
    RIGHT LEG
  */

  ctx.beginPath();

  ctx.moveTo(
    x+47,
    y+135
  );

  ctx.lineTo(
    x+53,
    y+166
  );

  ctx.stroke();


  /*
    SHOES
  */

  ctx.strokeStyle="#090909";

  ctx.lineWidth=12;

  ctx.beginPath();

  ctx.moveTo(
    x+13,
    y+166
  );

  ctx.lineTo(
    x+27,
    y+166
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+48,
    y+166
  );

  ctx.lineTo(
    x+63,
    y+166
  );

  ctx.stroke();

}


/* =====================
   ENEMY HUMAN
===================== */

function drawEnemy(enemy){

  const x=enemy.x;
  const y=enemy.y;


  /*
    HEAD
  */

  ctx.fillStyle="#c98e68";

  ctx.beginPath();

  ctx.arc(
    x+25,
    y+24,
    20,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    HAIR
  */

  ctx.fillStyle="#222";

  ctx.beginPath();

  ctx.arc(
    x+25,
    y+18,
    19,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /*
    BODY
  */

  ctx.fillStyle="#a32121";

  ctx.beginPath();

  ctx.roundRect(
    x+8,
    y+42,
    34,
    42,
    7
  );

  ctx.fill();


  /*
    LEFT ARM
  */

  ctx.strokeStyle="#c98e68";

  ctx.lineWidth=9;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x+10,
    y+48
  );

  ctx.lineTo(
    x-5,
    y+75
  );

  ctx.stroke();


  /*
    RIGHT ARM
  */

  ctx.beginPath();

  ctx.moveTo(
    x+40,
    y+48
  );

  ctx.lineTo(
    x+53,
    y+70
  );

  ctx.stroke();


  /*
    ENEMY GUN
  */

  ctx.fillStyle="#222";

  ctx.fillRect(
    x+38,
    y+67,
    38,
    8
  );


  /*
    PANTS
  */

  ctx.fillStyle="#292929";

  ctx.fillRect(
    x+10,
    y+83,
    32,
    22
  );


  /*
    LEGS
  */

  ctx.strokeStyle="#292929";

  ctx.lineWidth=10;

  ctx.beginPath();

  ctx.moveTo(
    x+17,
    y+100
  );

  ctx.lineTo(
    x+13,
    y+125
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+34,
    y+100
  );

  ctx.lineTo(
    x+39,
    y+125
  );

  ctx.stroke();


  /*
    SHOES
  */

  ctx.strokeStyle="#050505";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    x+7,
    y+125
  );

  ctx.lineTo(
    x+18,
    y+125
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+34,
    y+125
  );

  ctx.lineTo(
    x+46,
    y+125
  );

  ctx.stroke();

}


/* =====================
   CREATE ENEMY
===================== */

function createEnemy(){

  if(!running)return;

  enemies.push({

    x:
      Math.random()*
      (canvas.width-60),

    y:-150,

    width:55,

    height:130,

    speed:
      1.5+
      Math.random()*2

  });

}


/* =====================
   SHOOT
===================== */

function shoot(){

  if(!running)return;


  bullets.push({

    x:
      player.x+
      player.width+
      50,

    y:
      player.y+88,

    width:20,

    height:5,

    speed:13

  });


  /*
    MUZZLE FLASH
  */

  for(let i=0;i<8;i++){

    particles.push({

      x:
        player.x+
        player.width+
        120,

      y:
        player.y+90,

      vx:
        Math.random()*6,

      vy:
        (Math.random()-.5)*6,

      life:20

    });

  }

}


/* =====================
   EXPLOSION
===================== */

function explosion(x,y){

  for(let i=0;i<18;i++){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*8,

      vy:
        (Math.random()-.5)*8,

      life:35

    });

  }

}


/* =====================
   UPDATE
===================== */

function update(){

  /* PLAYER */

  if(leftPressed){

    player.x-=player.speed;

  }

  if(rightPressed){

    player.x+=player.speed;

  }


  if(player.x<0)
    player.x=0;


  if(
    player.x+
    player.width+
    30 >
    canvas.width
  ){

    player.x=
      canvas.width-
      player.width-
      30;

  }


  /* BULLETS */

  bullets.forEach(
    b=>{
      b.x+=b.speed;
    }
  );

  bullets=
    bullets.filter(
      b=>b.x<
      canvas.width+100
    );


  /* ENEMIES */

  enemies.forEach(
    e=>{
      e.y+=e.speed;
    }
  );


  /* PARTICLES */

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;

    p.life--;

  });

  particles=
    particles.filter(
      p=>p.life>0
    );


  /* BULLET HIT */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    let e=enemies[i];

    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      let b=bullets[j];


      if(

        b.x<
        e.x+e.width &&

        b.x+b.width>
        e.x &&

        b.y<
        e.y+e.height &&

        b.y+b.height>
        e.y

      ){

        explosion(
          e.x+25,
          e.y+60
        );

        enemies.splice(i,1);

        bullets.splice(j,1);

        score+=10;

        break;

      }

    }

  }


  /* ENEMY HIT PLAYER */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];


    if(

      player.x<
      e.x+e.width &&

      player.x+
      player.width>
      e.x &&

      player.y<
      e.y+e.height &&

      player.y+
      player.height>
      e.y

    ){

      player.health-=15;

      explosion(
        player.x+35,
        player.y+70
      );

      enemies.splice(i,1);

    }

  }


  /* ENEMY REACHES GROUND */

  enemies=
    enemies.filter(e=>{

      if(
        e.y>
        canvas.height+100
      ){

        player.health-=5;

        return false;

      }

      return true;

    });


  healthText.textContent=
    Math.max(0,player.health);

  scoreText.textContent=
    score;


  if(player.health<=0){

    endGame();

  }

}


/* =====================
   BACKGROUND
===================== */

function drawBackground(){

  const gradient=
    ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

  gradient.addColorStop(
    0,
    "#061426"
  );

  gradient.addColorStop(
    .65,
    "#174966"
  );

  gradient.addColorStop(
    1,
    "#10171c"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* MOON */

  ctx.fillStyle="#eee";

  ctx.beginPath();

  ctx.arc(
    canvas.width-60,
    70,
    28,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* GROUND */

  ctx.fillStyle="#11161a";

  ctx.fillRect(
    0,
    canvas.height-80,
    canvas.width,
    80
  );

}


/* =====================
   DRAW
===================== */

function draw(){

  drawBackground();


  /* BULLETS */

  bullets.forEach(b=>{

    ctx.fillStyle="#ffe000";

    ctx.shadowBlur=14;

    ctx.shadowColor="#ffcc00";

    ctx.fillRect(
      b.x,
      b.y,
      b.width,
      b.height
    );

    ctx.shadowBlur=0;

  });


  /* ENEMIES */

  enemies.forEach(
    drawEnemy
  );


  /* PARTICLES */

  particles.forEach(p=>{

    ctx.globalAlpha=
      p.life/35;

    ctx.fillStyle="#ffae00";

    ctx.fillRect(
      p.x,
      p.y,
      6,
      6
    );

  });

  ctx.globalAlpha=1;


  /* PLAYER */

  drawPlayer();

}


/* =====================
   LOOP
===================== */

function loop(){

  if(!running)return;

  update();

  draw();

  requestAnimationFrame(loop);

}


/* =====================
   GAME OVER
===================== */

function endGame(){

  running=false;

  clearInterval(enemyTimer);

  finalScore.textContent=
    score;

  gameOver.style.display="flex";

}


/* =====================
   RESTART
===================== */

document.getElementById("restart")
.onclick=function(){

  gameOver.style.display="none";

  startButton.click();

};


/* =====================
   MOBILE BUTTONS
===================== */

function holdButton(
  element,
  down,
  up
){

  element.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

      down();

    },
    {passive:false}
  );


  element.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      up();

    },
    {passive:false}
  );


  element.addEventListener(
    "touchcancel",
    up
  );

}


holdButton(

  document.getElementById("left"),

  ()=>leftPressed=true,

  ()=>leftPressed=false

);


holdButton(

  document.getElementById("right"),

  ()=>rightPressed=true,

  ()=>rightPressed=false

);


document.getElementById("shoot")
.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    shoot();

  },
  {passive:false}
);


/* =====================
   KEYBOARD
===================== */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=true;

    if(e.key==="ArrowRight")
      rightPressed=true;

    if(e.code==="Space")
      shoot();

  }
);


document.addEventListener(
  "keyup",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=false;

    if(e.key==="ArrowRight")
      rightPressed=false;

  }
);

</script>

</body>
</html>
