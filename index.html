<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Open World Photo Battle</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#4d8b45;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  color:white;
  text-align:center;
  background:linear-gradient(#09233a,#071018);
}

#menu h1{
  font-size:32px;
  text-shadow:0 0 15px #00d9ff;
}

#menu p{
  font-size:17px;
  max-width:330px;
}

.upload{
  background:#087cff;
  padding:15px 25px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
}

#photo{
  display:none;
}

#start{
  border:0;
  border-radius:12px;
  padding:15px 35px;
  background:#16b957;
  color:white;
  font-size:19px;
  font-weight:bold;
}

#hud{
  display:none;
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;
  justify-content:space-between;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.hudBox{
  background:rgba(0,0,0,.65);
  padding:8px 12px;
  border-radius:10px;
}

#talk{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  z-index:30;
  display:none;
  max-width:80%;
  padding:10px 16px;
  border-radius:12px;
  background:rgba(0,0,0,.75);
  color:white;
  text-align:center;
  font-size:16px;
}

#controls{
  display:none;
  position:fixed;
  left:0;
  right:0;
  bottom:15px;
  z-index:30;
  justify-content:space-between;
  align-items:center;
  padding:0 18px;
}

.move{
  display:flex;
  gap:8px;
}

.btn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:25px;
}

#fire{
  width:80px;
  height:80px;
  background:rgba(210,25,25,.9);
  font-size:30px;
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.85);
  color:white;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
}

#gameOver h2{
  font-size:38px;
}

#restart{
  padding:14px 30px;
  border:0;
  border-radius:12px;
  background:#087cff;
  color:white;
  font-size:18px;
}
</style>
</head>

<body>

<div id="menu">

  <h1>🌆 OPEN WORLD BATTLE</h1>

  <p>
    अपना फोटो लगाइए और मकान, सड़क,
    गाड़ियों और दुश्मनों वाली दुनिया में खेलिए।
  </p>

  <label class="upload">
    📷 अपना फोटो चुनें
    <input id="photo" type="file" accept="image/*">
  </label>

  <button id="start">
    ▶ GAME START
  </button>

</div>


<canvas id="canvas"></canvas>


<div id="hud">

  <div class="hudBox">
    ❤️ <span id="health">100</span>
  </div>

  <div class="hudBox">
    🏆 <span id="score">0</span>
  </div>

</div>


<div id="talk"></div>


<div id="controls">

  <div class="move">

    <button class="btn" id="up">▲</button>
    <button class="btn" id="left">◀</button>
    <button class="btn" id="down">▼</button>
    <button class="btn" id="right">▶</button>

  </div>

  <button class="btn" id="fire">🔫</button>

</div>


<div id="gameOver">

  <h2>💀 GAME OVER</h2>

  <p>
    आपका स्कोर:
    <b id="finalScore">0</b>
  </p>

  <button id="restart">
    🔄 फिर से खेलें
  </button>

</div>


<script>

/* =====================================================
   BASIC SETUP
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const hud =
document.getElementById("hud");

const controls =
document.getElementById("controls");

const talk =
document.getElementById("talk");

let photo=null;

let running=false;

let score=0;

let keys={
  up:false,
  down:false,
  left:false,
  right:false
};

let bullets=[];
let enemyBullets=[];
let enemies=[];
let buildings=[];
let cars=[];
let trees=[];
let particles=[];


/* =====================================================
   WORLD
===================================================== */

const WORLD_W=2400;
const WORLD_H=1800;

let camera={
  x:0,
  y:0
};


/* =====================================================
   PLAYER
===================================================== */

let player={
  x:1200,
  y:900,
  speed:4,
  health:100,
  width:46,
  height:78,
  cooldown:0
};


/* =====================================================
   PHOTO
===================================================== */

document
.getElementById("photo")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    photo=new Image();

    photo.src=e.target.result;

  };

  reader.readAsDataURL(file);

});


/* =====================================================
   CANVAS
===================================================== */

function resize(){

  canvas.width=innerWidth;
  canvas.height=innerHeight;

}

window.addEventListener("resize",resize);

resize();


/* =====================================================
   RANDOM WORLD
===================================================== */

function createWorld(){

  buildings=[];
  cars=[];
  trees=[];


  /* BUILDINGS */

  const buildingPositions=[

    [180,150,300,220],
    [650,130,260,190],
    [1120,160,330,210],
    [1650,130,300,220],

    [250,600,260,220],
    [720,620,300,210],
    [1350,580,300,220],
    [1820,610,300,210],

    [150,1120,320,220],
    [650,1170,270,200],
    [1200,1130,330,220],
    [1720,1120,300,230]

  ];

  buildingPositions.forEach(b=>{

    buildings.push({

      x:b[0],
      y:b[1],
      w:b[2],
      h:b[3]

    });

  });


  /* CARS */

  for(let i=0;i<20;i++){

    cars.push({

      x:100+Math.random()*2200,

      y:400+Math.random()*1000,

      w:65,

      h:35,

      angle:Math.random()>.5?0:Math.PI/2

    });

  }


  /* TREES */

  for(let i=0;i<80;i++){

    trees.push({

      x:Math.random()*WORLD_W,

      y:Math.random()*WORLD_H,

      size:18+Math.random()*12

    });

  }

}


/* =====================================================
   COLLISION
===================================================== */

function rectCollision(a,b){

  return(

    a.x < b.x+b.w &&

    a.x+a.width > b.x &&

    a.y < b.y+b.h &&

    a.y+a.height > b.y

  );

}


function blocked(x,y){

  const test={

    x:x-18,
    y:y-30,
    width:36,
    height:60

  };

  for(const b of buildings){

    if(rectCollision(test,b))
      return true;

  }

  return false;

}


/* =====================================================
   SPEECH
===================================================== */

function speak(text){

  if(!("speechSynthesis" in window))
    return;

  speechSynthesis.cancel();

  const voice=
    new SpeechSynthesisUtterance(text);

  voice.lang="hi-IN";

  voice.rate=.95;

  speechSynthesis.speak(voice);

  talk.textContent="🗣️ "+text;

  talk.style.display="block";

  clearTimeout(speak.timer);

  speak.timer=setTimeout(()=>{

    talk.style.display="none";

  },3500);

}


/* =====================================================
   PLAYER DIALOGUE
===================================================== */

function playerTalk(){

  const lines=[

    "चलो आगे चलते हैं।",

    "यह इलाका काफी बड़ा है।",

    "मुझे दुश्मनों से सावधान रहना होगा।",

    "आगे कोई दुश्मन दिखाई दे रहा है।"

  ];

  speak(
    lines[
      Math.floor(
        Math.random()*lines.length
      )
    ]
  );

}


/* =====================================================
   ENEMY DIALOGUE
===================================================== */

function enemyTalk(enemy){

  if(enemy.talked)
    return;

  enemy.talked=true;

  const lines=[

    "रुको!",

    "तुम यहाँ नहीं जा सकते।",

    "सावधान!",

    "मैं तुम्हें पकड़ लूँगा।"

  ];

  speak(
    lines[
      Math.floor(
        Math.random()*lines.length
      )
    ]
  );

}


/* =====================================================
   ENEMY CREATE
===================================================== */

function createEnemy(){

  let x,y;

  do{

    x=150+Math.random()*(WORLD_W-300);

    y=150+Math.random()*(WORLD_H-300);

  }while(
    Math.hypot(
      x-player.x,
      y-player.y
    )<450 ||
    blocked(x,y)
  );


  enemies.push({

    x:x,
    y:y,

    width:44,
    height:75,

    speed:1.1+Math.random()*.5,

    health:30,

    cooldown:Math.random()*100,

    talked:false

  });

}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

  if(!running)
    return;

  if(player.cooldown>0)
    return;

  player.cooldown=18;


  bullets.push({

    x:player.x+50,

    y:player.y+30,

    vx:10,

    vy:0,

    life:100

  });

}


/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(e){

  const dx=
    player.x-e.x;

  const dy=
    player.y-e.y;

  const distance=
    Math.hypot(dx,dy);

  if(distance>550)
    return;


  const speed=6;

  enemyBullets.push({

    x:e.x,

    y:e.y+30,

    vx:dx/distance*speed,

    vy:dy/distance*speed,

    life:120

  });

}


/* =====================================================
   DRAW GROUND
===================================================== */

function drawGround(){

  ctx.fillStyle="#4e9148";

  ctx.fillRect(
    0,
    0,
    WORLD_W,
    WORLD_H
  );


  /* ROADS */

  ctx.fillStyle="#35393b";

  /* horizontal roads */

  ctx.fillRect(
    0,
    430,
    WORLD_W,
    130
  );

  ctx.fillRect(
    0,
    980,
    WORLD_W,
    130
  );


  /* vertical roads */

  ctx.fillRect(
    470,
    0,
    130,
    WORLD_H
  );

  ctx.fillRect(
    1550,
    0,
    130,
    WORLD_H
  );


  /* ROAD LINES */

  ctx.strokeStyle="#e8d76a";

  ctx.lineWidth=4;

  ctx.setLineDash([30,25]);


  ctx.beginPath();

  ctx.moveTo(0,495);

  ctx.lineTo(WORLD_W,495);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(0,1045);

  ctx.lineTo(WORLD_W,1045);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(535,0);

  ctx.lineTo(535,WORLD_H);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(1615,0);

  ctx.lineTo(1615,WORLD_H);

  ctx.stroke();


  ctx.setLineDash([]);

}


/* =====================================================
   DRAW BUILDINGS
===================================================== */

function drawBuildings(){

  buildings.forEach(b=>{

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
      b.x+8,
      b.y+10,
      b.w,
      b.h
    );


    /* building */

    ctx.fillStyle="#c8a47a";

    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      b.h
    );


    /* roof */

    ctx.fillStyle="#713c2b";

    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      35
    );


    /* windows */

    ctx.fillStyle="#65b9d8";

    for(
      let xx=b.x+30;
      xx<b.x+b.w-20;
      xx+=55
    ){

      for(
        let yy=b.y+60;
        yy<b.y+b.h-25;
        yy+=55
      ){

        ctx.fillRect(
          xx,
          yy,
          28,
          30
        );

      }

    }


    /* door */

    ctx.fillStyle="#493124";

    ctx.fillRect(
      b.x+b.w/2-20,
      b.y+b.h-55,
      40,
      55
    );

  });

}


/* =====================================================
   DRAW TREES
===================================================== */

function drawTrees(){

  trees.forEach(t=>{

    ctx.fillStyle="#70452b";

    ctx.fillRect(
      t.x-5,
      t.y,
      10,
      t.size*1.5
    );

    ctx.fillStyle="#176c32";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}


/* =====================================================
   DRAW CARS
===================================================== */

function drawCars(){

  cars.forEach(c=>{

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    if(c.angle){

      ctx.rotate(Math.PI/2);

    }

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.fillRect(
      -c.w/2+4,
      -c.h/2+5,
      c.w,
      c.h
    );


    /* car body */

    ctx.fillStyle="#1766a8";

    ctx.fillRect(
      -c.w/2,
      -c.h/2,
      c.w,
      c.h
    );


    /* windows */

    ctx.fillStyle="#b7d9e6";

    ctx.fillRect(
      -12,
      -c.h/2+4,
      24,
      c.h-8
    );


    /* wheels */

    ctx.fillStyle="#111";

    ctx.fillRect(
      -c.w/2+5,
      -c.h/2-5,
      15,
      8
    );

    ctx.fillRect(
      c.w/2-20,
      -c.h/2-5,
      15,
      8
    );

    ctx.fillRect(
      -c.w/2+5,
      c.h/2-3,
      15,
      8
    );

    ctx.fillRect(
      c.w/2-20,
      c.h/2-3,
      15,
      8
    );

    ctx.restore();

  });

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

  const x=player.x;
  const y=player.y;


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    x+25,
    y+76,
    27,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* photo head */

  if(photo && photo.complete){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x+25,
      y+22,
      23,
      0,
      Math.PI*2
    );

    ctx.clip();

    ctx.drawImage(
      photo,
      x+2,
      y-2,
      46,
      48
    );

    ctx.restore();

  }else{

    ctx.fillStyle="#d49a72";

    ctx.beginPath();

    ctx.arc(
      x+25,
      y+22,
      23,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* body */

  ctx.fillStyle="#176bb0";

  ctx.fillRect(
    x+9,
    y+43,
    32,
    35
  );


  /* arms */

  ctx.strokeStyle="#d49a72";

  ctx.lineWidth=9;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x+12,
    y+49
  );

  ctx.lineTo(
    x-5,
    y+66
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+39,
    y+49
  );

  ctx.lineTo(
    x+54,
    y+61
  );

  ctx.stroke();


  /* gun */

  ctx.fillStyle="#202020";

  ctx.fillRect(
    x+45,
    y+57,
    42,
    8
  );

  ctx.fillRect(
    x+78,
    y+59,
    17,
    5
  );


  /* legs */

  ctx.strokeStyle="#252d35";

  ctx.lineWidth=11;

  ctx.beginPath();

  ctx.moveTo(
    x+18,
    y+77
  );

  ctx.lineTo(
    x+14,
    y+100
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+33,
    y+77
  );

  ctx.lineTo(
    x+38,
    y+100
  );

  ctx.stroke();


  /* shoes */

  ctx.strokeStyle="#090909";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    x+8,
    y+101
  );

  ctx.lineTo(
    x+20,
    y+101
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+34,
    y+101
  );

  ctx.lineTo(
    x+47,
    y+101
  );

  ctx.stroke();

}


/* =====================================================
   DRAW ENEMY
===================================================== */

function drawEnemy(e){

  const x=e.x;
  const y=e.y;


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    x+22,
    y+74,
    25,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.fillStyle="#c98d67";

  ctx.beginPath();

  ctx.arc(
    x+22,
    y+21,
    21,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle="#222";

  ctx.beginPath();

  ctx.arc(
    x+22,
    y+16,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* shirt */

  ctx.fillStyle="#9e2929";

  ctx.fillRect(
    x+7,
    y+40,
    31,
    37
  );


  /* arms */

  ctx.strokeStyle="#c98d67";

  ctx.lineWidth=8;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x+9,
    y+47
  );

  ctx.lineTo(
    x-5,
    y+65
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+36,
    y+47
  );

  ctx.lineTo(
    x+49,
    y+60
  );

  ctx.stroke();


  /* gun */

  ctx.fillStyle="#222";

  ctx.fillRect(
    x+40,
    y+56,
    38,
    8
  );


  /* pants */

  ctx.strokeStyle="#272727";

  ctx.lineWidth=11;

  ctx.beginPath();

  ctx.moveTo(
    x+16,
    y+77
  );

  ctx.lineTo(
    x+12,
    y+101
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+30,
    y+77
  );

  ctx.lineTo(
    x+35,
    y+101
  );

  ctx.stroke();

}


/* =====================================================
   PARTICLES
===================================================== */

function explosion(x,y){

  for(let i=0;i<15;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*7,

      vy:(Math.random()-.5)*7,

      life:30

    });

  }

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

  if(player.cooldown>0)
    player.cooldown--;


  /* movement */

  let dx=0;
  let dy=0;

  if(keys.left)dx-=player.speed;
  if(keys.right)dx+=player.speed;
  if(keys.up)dy-=player.speed;
  if(keys.down)dy+=player.speed;


  let nx=player.x+dx;
  let ny=player.y+dy;


  if(
    nx>30 &&
    nx<WORLD_W-80 &&
    !blocked(nx,player.y)
  ){

    player.x=nx;

  }


  if(
    ny>30 &&
    ny<WORLD_H-120 &&
    !blocked(player.x,ny)
  ){

    player.y=ny;

  }


  /* bullets */

  bullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

  });

  bullets=
    bullets.filter(
      b=>b.life>0
    );


  /* enemy bullets */

  enemyBullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

  });


  enemyBullets=
    enemyBullets.filter(
      b=>b.life>0
    );


  /* enemy AI */

  enemies.forEach(e=>{

    const dx=
      player.x-e.x;

    const dy=
      player.y-e.y;

    const distance=
      Math.hypot(dx,dy);


    if(distance<600){

      e.x+=
        dx/distance*
        e.speed;

      e.y+=
        dy/distance*
        e.speed;

      enemyTalk(e);


      if(e.cooldown>0){

        e.cooldown--;

      }else{

        enemyShoot(e);

        e.cooldown=
          80+Math.random()*60;

      }

    }

  });


  /* bullet -> enemy */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];

    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      const b=bullets[j];


      if(

        b.x>e.x-10 &&
        b.x<e.x+e.width+10 &&

        b.y>e.y-10 &&
        b.y<e.y+e.height+10

      ){

        e.health-=10;

        bullets.splice(j,1);

        explosion(
          e.x+20,
          e.y+35
        );


        if(e.health<=0){

          enemies.splice(i,1);

          score+=20;

        }

        break;

      }

    }

  }


  /* enemy bullet -> player */

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=enemyBullets[i];


    if(

      b.x>player.x &&
      b.x<player.x+player.width &&

      b.y>player.y &&
      b.y<player.y+player.height

    ){

      player.health-=8;

      enemyBullets.splice(i,1);

      explosion(
        player.x+20,
        player.y+35
      );

    }

  }


  /* particles */

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;

    p.life--;

  });

  particles=
    particles.filter(
      p=>p.life>0
    );


  /* camera */

  camera.x=
    player.x-
    canvas.width/2;

  camera.y=
    player.y-
    canvas.height/2;


  camera.x=
    Math.max(
      0,
      Math.min(
        WORLD_W-canvas.width,
        camera.x
      )
    );


  camera.y=
    Math.max(
      0,
      Math.min(
        WORLD_H-canvas.height,
        camera.y
      )
    );


  document.getElementById(
    "health"
  ).textContent=
    Math.max(
      0,
      player.health
    );

  document.getElementById(
    "score"
  ).textContent=score;


  if(player.health<=0){

    endGame();

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  drawGround();

  drawTrees();

  drawBuildings();

  drawCars();


  /* enemy bullets */

  enemyBullets.forEach(b=>{

    ctx.fillStyle="#ff3b30";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* player bullets */

  bullets.forEach(b=>{

    ctx.fillStyle="#ffd400";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* enemies */

  enemies.forEach(drawEnemy);


  /* particles */

  particles.forEach(p=>{

    ctx.globalAlpha=
      p.life/30;

    ctx.fillStyle="#ffb000";

    ctx.fillRect(
      p.x,
      p.y,
      6,
      6
    );

  });

  ctx.globalAlpha=1;


  drawPlayer();


  ctx.restore();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

  if(!running)
    return;

  update();

  draw();

  requestAnimationFrame(loop);

}


/* =====================================================
   START
===================================================== */

document
.getElementById("start")
.onclick=function(){

  resize();

  createWorld();

  menu.style.display="none";

  hud.style.display="flex";

  controls.style.display="flex";


  player.x=
    WORLD_W/2;

  player.y=
    WORLD_H/2;

  player.health=100;

  score=0;

  bullets=[];
  enemyBullets=[];
  enemies=[];
  particles=[];

  for(let i=0;i<10;i++)
    createEnemy();


  running=true;

  setTimeout(
    ()=>speak("गेम शुरू हो गया। सावधान रहो!"),
    700
  );

  requestAnimationFrame(loop);

};


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  running=false;

  document.getElementById(
    "finalScore"
  ).textContent=score;

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* =====================================================
   RESTART
===================================================== */

document
.getElementById("restart")
.onclick=function(){

  document.getElementById(
    "gameOver"
  ).style.display="none";

  document.getElementById(
    "start"
  ).click();

};


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function hold(id,down,up){

  const el=
    document.getElementById(id);


  el.addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      down();

    },
    {passive:false}
  );


  el.addEventListener(
    "touchend",
    e=>{

      e.preventDefault();

      up();

    },
    {passive:false}
  );


  el.addEventListener(
    "touchcancel",
    up
  );

}


hold(
  "up",
  ()=>keys.up=true,
  ()=>keys.up=false
);

hold(
  "down",
  ()=>keys.down=true,
  ()=>keys.down=false
);

hold(
  "left",
  ()=>keys.left=true,
  ()=>keys.left=false
);

hold(
  "right",
  ()=>keys.right=true,
  ()=>keys.right=false
);


/* FIRE */

document
.getElementById("fire")
.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    shoot();

  },
  {passive:false}
);


/* =====================================================
   COMPUTER
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowUp")
      keys.up=true;

    if(e.key==="ArrowDown")
      keys.down=true;

    if(e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="ArrowRight")
      keys.right=true;

    if(e.code==="Space")
      shoot();

    if(e.key.toLowerCase()==="v")
      playerTalk();

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowUp")
      keys.up=false;

    if(e.key==="ArrowDown")
      keys.down=false;

    if(e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="ArrowRight")
      keys.right=false;

  }
);


/* =====================================================
   TAP GAME TO SPEAK
===================================================== */

canvas.addEventListener(
  "dblclick",
  function(){

    if(running)
      playerTalk();

  }
);

</script>
